[package]
name = "score64-cli"
description = "The `score64` command-line tool: run the pipeline, render, pack and report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "score64"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
score64-engine = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

# Built and released by dist (dist-workspace.toml).
[package.metadata.dist]
dist = true
# Notices for the third-party code linked into the CLI: ONNX Runtime and the Basic Pitch port.
include = ["../../THIRD_PARTY.md"]
