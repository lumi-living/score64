[package]
name = "score64-core"
description = "Pure, I/O-free score model (tracker-grid IR), voice profiles, reduction rules and validator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# JSON Schemas for the model types, for engine command arguments that embed them (ADR-012).
schema = ["dep:schemars"]
# proptest strategies for the model types (`score64_core::strategies`), for property tests in this and other crates.
proptest = ["dep:proptest"]

[dependencies]
serde = { workspace = true }
schemars = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
toml = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
