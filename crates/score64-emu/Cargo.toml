[package]
name = "score64-emu"
description = "GPL helper: 6502 + SID emulation that runs packed C64 music players for rendering and live audition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "score64-emu"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
emulator_6502 = { workspace = true }
resid-rs = { workspace = true }
residfp-sys = { workspace = true }
score64-formats = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# Built and released by dist (dist-workspace.toml) as its own archive. Its GPL text is COPYING, not LICENSE, so that
# extracting every release archive into one directory keeps both the MIT LICENSE and the GPL COPYING
# (docs/TOOLING.md). THIRD_PARTY.md carries the notices for the vendored reSIDfp.
[package.metadata.dist]
dist = true
auto-includes = false
include = ["COPYING", "../../README.md", "../../THIRD_PARTY.md"]
