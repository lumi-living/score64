[package]
name = "score64-app"
description = "Score64 Studio: the egui/eframe desktop app for reviewing, comparing and approving audio assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
egui_material_icons = { workspace = true }
image = { workspace = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "score64-app"
path = "src/main.rs"

[lints]
workspace = true

# Built and released by dist (dist-workspace.toml).
[package.metadata.dist]
dist = true
# Notices for the bundled fonts: their OFL texts travel with them, and THIRD_PARTY.md covers Material Symbols.
include = [
    "../../THIRD_PARTY.md",
    "assets/fonts/OFL-Inter.txt",
    "assets/fonts/OFL-JetBrainsMono.txt",
]
