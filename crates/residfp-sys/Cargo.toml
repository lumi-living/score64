[package]
name = "residfp-sys"
description = "reSIDfp (libresidfp 1.2.3, vendored) behind a C shim, for score64-emu only (ADR-011)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The vendored library's licence; it combines with the GPL-3.0-or-later helper. Only score64-emu may depend on this
# crate (ADR-002, CI job licence-boundary).
license = "GPL-2.0-or-later"
repository.workspace = true
authors.workspace = true
publish.workspace = true
links = "residfp"
build = "build.rs"

[build-dependencies]
cc = { workspace = true }

# Not `workspace = true`: the workspace forbids unsafe code, and `forbid` cannot be relaxed inside a crate. Same lints,
# with unsafe code denied except in the FFI module.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
