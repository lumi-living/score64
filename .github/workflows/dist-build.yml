# Manual test build of the dist release archives (#9), as in Convert64.
# Real releases come from release.yml (generated by `dist generate`) on
# version tags. This workflow only builds and uploads workflow artifacts:
# no GitHub release, no tag, nothing published.
name: dist build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIST_VERSION: v0.33.0

jobs:
  build:
    name: dist build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same runners dist plan picks for these targets.
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: dist-${{ matrix.target }}
      - name: Install dist (Unix)
        if: runner.os != 'Windows'
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Install dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm "https://github.com/axodotdev/cargo-dist/releases/download/$env:DIST_VERSION/cargo-dist-installer.ps1" | iex
      - name: dist build
        run: dist build --artifacts=local --target=${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: score64-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.zip
            target/distrib/*.sha256
          if-no-files-found: error
