name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Keep the job name and matrix key fixed once branch protection requires
  # the contexts "rust (ubuntu-latest)", "rust (macos-latest)" and
  # "rust (windows-latest)". Renaming them breaks merging.
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs exactly what rust-toolchain.toml pins (channel, components, targets).
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  # The GPL crates must stay leaves: no MIT member may depend on any GPL package, directly or not (ADR-002, ADR-011).
  licence-boundary:
    name: licence-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: No MIT crate depends on GPL code
        # Every workspace member that is not itself GPL must have no GPL package anywhere in its normal or build
        # dependency tree: score64-emu, residfp-sys and any GPL crate from crates.io (resid-rs, zinc64, ...).
        run: |
          meta=$(cargo metadata --format-version 1 --locked)
          # GPL = every alternative of the licence expression is (L)GPL; "MIT OR LGPL-2.1" is not.
          gpl=$(printf '%s\n' "$meta" | jq -r 'def gplonly: (. // "") | [splits(" OR |/")] | length > 0 and all(test("GPL"));
            .packages[] | select(.license | gplonly) | .name' | sort -u)
          mit=$(printf '%s\n' "$meta" | jq -r 'def gplonly: (. // "") | [splits(" OR |/")] | length > 0 and all(test("GPL"));
            .workspace_members[] as $id | .packages[] | select(.id == $id) | select(.license | gplonly | not) | .name')
          echo "GPL packages: $(echo $gpl)"
          status=0
          for c in $mit; do
            deps=$(cargo tree -p "$c" -e normal,build --prefix none --locked | awk '{print $1}' | sort -u)
            for g in $gpl; do
              if printf '%s\n' "$deps" | grep -qx "$g"; then
                echo "$c depends on GPL package $g; see ADR-002" >&2
                status=1
              fi
            done
          done
          exit $status
