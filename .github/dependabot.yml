version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned exactly in score64-emu; changing either changes rendered audio and needs the oracle tests (ADR-010).
      - dependency-name: "emulator_6502"
      - dependency-name: "resid-rs"
      # A release candidate whose API still changes between rcs; bumped by hand with the sidecar differential test
      # (#21, #23), see docs/TOOLING.md.
      - dependency-name: "ort"
      # pinned to Convert64's versions; bump both apps together by hand
      - dependency-name: "egui"
      - dependency-name: "eframe"
      - dependency-name: "egui_material_icons"
    labels: ["enhancement"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["enhancement"]
