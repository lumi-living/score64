[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist), as in Convert64. Edit this file, then run `dist generate` to refresh
# .github/workflows/release.yml; never edit release.yml by hand.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# No installers yet: releases are plain unsigned archives, one per app (dist cannot put several packages in one
# archive). Extract them into one directory so `score64` and `score64-app` find `score64-emu` beside them
# (docs/TOOLING.md); signed bundles and installers are E17 (#109).
installers = []
# The platforms CI tests on (#109).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
# Release CI runs on version tags only. Manual test builds use the separate dist-build workflow (workflow_dispatch).
pr-run-mode = "skip"
