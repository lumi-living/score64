[workspace]
resolver = "3"
members = [
    "crates/score64-core",
    "crates/score64-formats",
    "crates/score64-project",
    "crates/score64-analysis",
    "crates/score64-adapters",
    "crates/score64-engine",
    "crates/score64-cli",
    "crates/score64-mcp",
    "crates/score64-app",
    "crates/score64-emu",
    "crates/residfp-sys",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/lumi-living/score64"
authors = ["Lumi Living <https://github.com/lumi-living>"]
publish = false

# Every external crate is pinned here and referenced from the member crates
# with `{ workspace = true }` (docs/TAD.md §5 lists the allowed set).
# crates/score64-emu is GPL-3.0-or-later and must never be a dependency of
# another member (ADR-002).
[workspace.dependencies]
score64-core = { path = "crates/score64-core" }
score64-formats = { path = "crates/score64-formats" }
score64-project = { path = "crates/score64-project" }
score64-analysis = { path = "crates/score64-analysis" }
score64-adapters = { path = "crates/score64-adapters" }
score64-engine = { path = "crates/score64-engine" }
clap = { version = "4.6.7", features = ["derive"] }
ort = "=2.0.0-rc.14"
# score64-emu only (GPL helper, ADR-002 / ADR-010 / ADR-011)
residfp-sys = { path = "crates/residfp-sys" }
cc = "1.8.0"
emulator_6502 = { version = "=1.1.0", default-features = false, features = ["illegal_opcodes", "binary_coded_decimal", "implementation_transparency"] }
resid-rs = "=1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
proptest = "1.12.0"
toml = "1.1.8"
insta = "1.49.0"
blake3 = "1.8.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
